context:
  version: "0.27.0"

package:
  name: fsharplint
  version: ${{ version }}

source:
  - git: https://github.com/fsprojects/fsharplint
    tag: v${{ version }}
  - url: https://github.com/fsprojects/FSharpLint/archive/refs/tags/v${{ version }}.tar.gz
    sha256: f6482af5d36f66422be14654aaa42fa2d381890c3db90f8f1585b184fd0600b5
    target_directory: archive

build:
  noarch: generic
  number: 0

requirements:
  build:
    - paket
    - dotnet
    - nuget-license
    - sed
  run:
    - dotnet

tests:
  - script:
      - dotnet-fsharplint --help

about:
  homepage: https://github.com/fsprojects/fsharplint
  license: MIT
  license_file: LICENSE
  summary: Lint tool for F#
  repository: https://github.com/fsprojects/fsharplint

extra:
  recipe-maintainers:
    - danielnachun
